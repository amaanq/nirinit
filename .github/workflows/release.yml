name: Tag and Release

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      stage: prepare
      version-command: nix run nixpkgs#fq -- -r .package.version Cargo.toml
      default-branch: master

  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suffix: linux-amd64 }
          - { os: ubuntu-26.04-arm, suffix: linux-arm64 }
    uses: manic-systems/workflows/.github/workflows/rust-build.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      upload: true
      build-command: nix build -L .#static
      version: ${{ needs.prepare.outputs.version }}
      os: ${{ matrix.os }}
      suffix: ${{ matrix.suffix }}

  finalize:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.build.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}

  publish:
    permissions:
      contents: write
      id-token: write
    needs: [prepare, finalize]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.finalize.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@06a950a6ef1291d634844fef482d44c6b3852f64 # v2.2.0
    with:
      stage: publish
      version: ${{ needs.prepare.outputs.version }}
      publish-command: nix develop --command cargo publish --locked
