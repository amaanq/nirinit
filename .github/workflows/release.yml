name: Tag and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      stage: prepare
      version-command: nix run nixpkgs#fq -- -r .package.version Cargo.toml
      default-branch: master

  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suffix: linux-amd64 }
          - { os: ubuntu-26.04-arm, suffix: linux-arm64 }
    uses: manic-systems/workflows/.github/workflows/rust-build.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      upload: true
      build-command: nix build -L .#static
      version: ${{ needs.prepare.outputs.version }}
      os: ${{ matrix.os }}
      suffix: ${{ matrix.suffix }}

  finalize:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.build.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}

  publish:
    permissions:
      contents: write
      id-token: write
    needs: [prepare, finalize]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.finalize.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      stage: publish
      version: ${{ needs.prepare.outputs.version }}
      publish-command: nix develop --command cargo publish --locked
